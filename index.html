ed arc length is always 10\u03C0 cm.","Jumlah diameternya selalu 20 cm, sehingga jumlah panjang busurnya selalu 10\u03C0 cm."]),solution:q(["For 8 cm and 12 cm, the small arcs total 4\u03C0 + 6\u03C0 = 10\u03C0 cm.","Untuk 8 cm dan 12 cm, panjang kedua busur kecil 4\u03C0 + 6\u03C0 = 10\u03C0 cm."],["Add the unchanged large arc, 10\u03C0 cm. The perimeter remains 20\u03C0 cm for every allowed split.","Tambahkan busur besar yang tetap 10\u03C0 cm. Kelilingnya tetap 20\u03C0 cm untuk setiap pembagian yang tersedia."]),insight:g("A changing picture can hide an unchanged total.","Gambar yang berubah bisa memiliki jumlah yang tetap."),feedback:g("Yes. The individual arcs change, but their total does not.","Ya. Masing-masing busur berubah, tetapi jumlah panjangnya tetap.")},{id:4,group:0,title:g("The straight part counts.","Bagian lurus ikut dihitung."),mode:Jt,diagram:"semicircle",params:{r:7},answer:36,unit:"cm",pi:"22/7",prompt:g("A garden is a semicircle of radius 7 cm. A fence follows its entire boundary, including the straight side.","Sebuah taman berbentuk setengah lingkaran berjari-jari 7 cm. Pagar dipasang di seluruh batas taman, termasuk sisi lurusnya."),question:g("How long is the fence?","Berapa panjang seluruh pagar?"),hints:q(["Trace the garden's full boundary once.","Telusuri seluruh batas taman satu kali."],["You need one semicircular arc and one diameter.","Kamu memerlukan satu busur setengah lingkaran dan satu diameter."],["The arc is 22 cm. The diameter is twice 7 cm.","Panjang busurnya 22 cm. Diameternya dua kali 7 cm."]),solution:q(["Arc length = \u03C0r = (22/7) \xD7 7 = 22 cm.","Panjang busur = \u03C0r = (22/7) \xD7 7 = 22 cm."],["Straight side = 2r = 14 cm. Total = 22 + 14 = 36 cm.","Sisi lurus = 2r = 14 cm. Total = 22 + 14 = 36 cm."]),insight:g("The perimeter of a semicircle includes its diameter.","Keliling setengah lingkaran mencakup diameternya."),feedback:g("Right: 22 cm of curve and 14 cm of straight fence.","Benar: pagar melengkung 22 cm dan pagar lurus 14 cm.")},{id:5,group:1,title:g("A circle fits just right.","Lingkarannya pas."),mode:eo,diagram:"square",params:{side:16,unknown:!0},answer:8,unit:"cm",prompt:g("A circle fits exactly inside a square of side 16 cm. It touches all four sides.","Sebuah lingkaran tepat berada di dalam persegi bersisi 16 cm dan menyentuh keempat sisinya."),question:g("What is the radius of the circle?","Berapa jari-jari lingkaran itu?"),hints:q(["Look at the width of the circle from one side of the square to the other.","Perhatikan lebar lingkaran dari satu sisi persegi ke sisi di seberangnya."],["That full width is a diameter.","Lebar penuh tersebut adalah diameter."],["The diameter is 16 cm. A radius is half a diameter.","Diameternya 16 cm. Jari-jari adalah setengah diameter."]),solution:q(["The diameter equals the square's side: 16 cm.","Diameter sama dengan panjang sisi persegi: 16 cm."],["Radius = 16 \xF7 2 = 8 cm.","Jari-jari = 16 \xF7 2 = 8 cm."]),insight:g("A snug fit turns a side length into a diameter.","Lingkaran yang pas di dalam persegi memiliki diameter sepanjang sisi persegi."),feedback:g("Yes. You used the fit of the shapes to uncover the diameter.","Ya. Kamu memakai susunan bangun untuk menemukan diameternya.")},{id:6,group:1,title:g("Two circles, one row.","Dua lingkaran sejajar."),mode:to,diagram:"pair",answer:7,unit:"cm",prompt:g("Two equal circles fit exactly in a 28 cm by 14 cm rectangle. They touch each other and the rectangle as shown.","Dua lingkaran sama besar tepat berada di dalam persegi panjang 28 cm \xD7 14 cm. Keduanya saling bersinggungan dan menyentuh sisi persegi panjang seperti pada gambar."),question:g("What is the radius of each circle?","Berapa jari-jari setiap lingkaran?"),hints:q(["How many radii fit across the 28 cm width?","Ada berapa jari-jari sepanjang lebar 28 cm?"],["Each circle uses two radii across. Two circles use four.","Setiap lingkaran memuat dua jari-jari pada lebarnya. Dua lingkaran memuat empat."],["Use 28 \xF7 4, or check with the height 14 \xF7 2.","Hitung 28 \xF7 4, atau periksa dengan tinggi: 14 \xF7 2."]),solution:q(["28 cm = four radii, so r = 28 \xF7 4 = 7 cm.","28 cm = empat jari-jari, sehingga r = 28 \xF7 4 = 7 cm."],["Check: the height is one diameter, 2 \xD7 7 = 14 cm.","Periksa: tingginya satu diameter, yaitu 2 \xD7 7 = 14 cm."]),insight:g("Count radii along a straight line.","Hitung banyak jari-jari pada satu garis lurus."),feedback:g("Correct. Both the width and the height confirm 7 cm.","Benar. Lebar dan tinggi sama-sama menghasilkan 7 cm.")},{id:7,group:1,title:g("The missing piece of length.","Panjang yang belum diketahui."),mode:lo,diagram:"arbelos",params:{d:24,a:8,missing:!0},answer:8,unit:"cm",prompt:g("The large diameter is 24 cm. The left small diameter is 8 cm. The two small diameters fill the entire large diameter.","Diameter besar 24 cm. Diameter kecil di kiri 8 cm. Kedua diameter kecil mengisi seluruh diameter besar."),question:g("What is the radius of the right-hand semicircle?","Berapa jari-jari setengah lingkaran di kanan?"),hints:q(["First find the missing small diameter.","Cari dahulu diameter kecil yang belum diketahui."],["The two small diameters add to 24 cm.","Jumlah kedua diameter kecil adalah 24 cm."],["Right diameter = 24 \u2212 8. Then halve it.","Diameter kanan = 24 \u2212 8. Lalu bagi dua."]),solution:q(["Right diameter = 24 \u2212 8 = 16 cm.","Diameter kanan = 24 \u2212 8 = 16 cm."],["Right radius = 16 \xF7 2 = 8 cm.","Jari-jari kanan = 16 \xF7 2 = 8 cm."]),insight:g("Find the diameter before the radius.","Temukan diameternya sebelum jari-jarinya."),feedback:g("Exactly. Subtract first, then halve.","Tepat. Kurangi dahulu, lalu bagi dua.")},{id:8,group:1,title:g("The space around a circle.","Ruang di luar lingkaran."),mode:Jt,diagram:"square",params:{side:14,shade:!0},answer:42,unit:"cm\xB2",pi:"22/7",prompt:g("A circle touches all four sides of a square of side 14 cm. The space outside the circle is shaded.","Sebuah lingkaran menyentuh keempat sisi persegi bersisi 14 cm. Daerah di luar lingkaran diarsir."),question:g("Find the shaded area.","Tentukan luas daerah arsiran."),hints:q(["Think: whole square minus circle.","Pikirkan: seluruh persegi dikurangi lingkaran."],["The circle's radius is 7 cm, not 14 cm.","Jari-jari lingkarannya 7 cm, bukan 14 cm."],["Square area = 196 cm\xB2. Circle area = 154 cm\xB2.","Luas persegi = 196 cm\xB2. Luas lingkaran = 154 cm\xB2."]),solution:q(["Square area = 14 \xD7 14 = 196 cm\xB2. Radius = 14 \xF7 2 = 7 cm.","Luas persegi = 14 \xD7 14 = 196 cm\xB2. Jari-jari = 14 \xF7 2 = 7 cm."],["Circle area = (22/7) \xD7 7\xB2 = 154 cm\xB2. Shaded area = 196 \u2212 154 = 42 cm\xB2.","Luas lingkaran = (22/7) \xD7 7\xB2 = 154 cm\xB2. Luas arsiran = 196 \u2212 154 = 42 cm\xB2."]),insight:g("An awkward region may be a simple difference.","Daerah yang rumit bisa berupa selisih dua luas sederhana."),feedback:g("You connected the hidden radius to a whole-minus-part strategy.","Kamu menghubungkan jari-jari tersembunyi dengan strategi keseluruhan dikurangi bagian.")},{id:9,group:2,title:g("A shape made by subtraction.","Bangun dari pengurangan."),mode:eo,diagram:"arbelos",params:{d:20,a:10},answer:25,unit:"\u03C0 cm\xB2",prompt:g("Return to the 20 cm semicircle with two 10 cm semicircles inside it.","Kembali ke setengah lingkaran berdiameter 20 cm dengan dua setengah lingkaran berdiameter 10 cm di dalamnya."),question:g("What is the green area? Leave your answer in terms of \u03C0.","Berapa luas daerah hijau? Nyatakan jawaban dalam bentuk \u03C0."),hints:q(["Start with the whole large semicircle.","Mulailah dari seluruh setengah lingkaran besar."],["The large radius is 10 cm; each small radius is 5 cm.","Jari-jari besar 10 cm; masing-masing jari-jari kecil 5 cm."],["Subtract both small areas: \xBD\u03C0 \xD7 10\xB2 \u2212 2 \xD7 (\xBD\u03C0 \xD7 5\xB2).","Kurangi kedua luas kecil: \xBD\u03C0 \xD7 10\xB2 \u2212 2 \xD7 (\xBD\u03C0 \xD7 5\xB2)."]),solution:q(["Large semicircle area = \xBD\u03C0 \xD7 10\xB2 = 50\u03C0 cm\xB2.","Luas setengah lingkaran besar = \xBD\u03C0 \xD7 10\xB2 = 50\u03C0 cm\xB2."],["Each small area = \xBD\u03C0 \xD7 5\xB2 = 12.5\u03C0 cm\xB2.","Luas setiap bagian kecil = \xBD\u03C0 \xD7 5\xB2 = 12,5\u03C0 cm\xB2."],["Green area = 50\u03C0 \u2212 12.5\u03C0 \u2212 12.5\u03C0 = 25\u03C0 cm\xB2.","Luas hijau = 50\u03C0 \u2212 12,5\u03C0 \u2212 12,5\u03C0 = 25\u03C0 cm\xB2."]),insight:g("Areas depend on squared radii.","Luas bergantung pada kuadrat jari-jari."),feedback:g("Yes. The two small areas together are half the large semicircle's area.","Ya. Jumlah kedua luas kecil adalah setengah luas setengah lingkaran besar.")},{id:10,group:2,title:g("A curve and a chord.","Busur dan tali busur."),mode:to,diagram:"segment",answer:28.5,unit:"cm\xB2",pi:"3.14",prompt:g("A quarter circle has radius 10 cm. A straight line joins the two ends of its arc. The region between the line and the arc is shaded.","Seperempat lingkaran berjari-jari 10 cm. Kedua ujung busurnya dihubungkan oleh garis lurus. Daerah di antara garis dan busur diarsir."),question:g("Find the shaded area.","Tentukan luas daerah arsiran."),hints:q(["What familiar shape lies inside the quarter circle but outside the shading?","Bangun apa yang berada di dalam seperempat lingkaran, tetapi di luar arsiran?"],["Subtract a right triangle from the quarter circle.","Kurangi luas segitiga siku-siku dari luas seperempat lingkaran."],["The triangle has base 10 cm and height 10 cm.","Segitiganya memiliki alas 10 cm dan tinggi 10 cm."]),solution:q(["Quarter circle area = \xBC \xD7 3.14 \xD7 10\xB2 = 78.5 cm\xB2.","Luas seperempat lingkaran = \xBC \xD7 3,14 \xD7 10\xB2 = 78,5 cm\xB2."],["Triangle area = \xBD \xD7 10 \xD7 10 = 50 cm\xB2.","Luas segitiga = \xBD \xD7 10 \xD7 10 = 50 cm\xB2."],["Shaded area = 78.5 \u2212 50 = 28.5 cm\xB2.","Luas arsiran = 78,5 \u2212 50 = 28,5 cm\xB2."]),insight:g("A curved segment can be a sector minus a triangle.","Tembereng dapat diperoleh dari juring dikurangi segitiga."),feedback:g("Right. You separated the circular part from the triangular part.","Benar. Kamu memisahkan bagian lingkaran dan bagian segitiga.")},{id:11,group:2,title:g("Compare areas, not lengths.","Bandingkan luasnya."),mode:lo,diagram:"square",params:{side:14},type:"choice",answer:"11:14",pi:"22/7",prompt:g("A circle fits exactly inside a square of side 14 cm.","Sebuah lingkaran tepat berada di dalam persegi bersisi 14 cm."),question:g("What is the ratio of the circle's area to the whole square's area?","Berapa perbandingan luas lingkaran terhadap luas seluruh persegi?"),options:[{value:"1:2",label:g("1 : 2","1 : 2")},{value:"11:14",label:g("11 : 14","11 : 14")},{value:"14:11",label:g("14 : 11","14 : 11")},{value:"3:14",label:g("3 : 14","3 : 14")}],hints:q(["Keep the requested order: circle, then whole square.","Ikuti urutannya: lingkaran, lalu seluruh persegi."],["The two areas are 154 cm\xB2 and 196 cm\xB2.","Kedua luasnya 154 cm\xB2 dan 196 cm\xB2."],["Simplify 154 : 196 by dividing both numbers by 14.","Sederhanakan 154 : 196 dengan membagi keduanya dengan 14."]),solution:q(["Circle : square = 154 : 196 = 11 : 14.","Lingkaran : persegi = 154 : 196 = 11 : 14."],["The square includes the circle. We are comparing the circle with the whole square, not just the corners.","Persegi mencakup lingkarannya. Kita membandingkan lingkaran dengan seluruh persegi, bukan hanya daerah sudutnya."]),insight:g("Name both regions before forming a ratio.","Tentukan kedua daerah sebelum menyusun perbandingan."),feedback:g("Correct. You compared the requested regions in the right order.","Benar. Kamu membandingkan daerah yang diminta dengan urutan yang tepat.")},{id:12,group:2,title:g("A ring of space.","Daerah berbentuk cincin."),mode:Jt,diagram:"ring",params:{outer:10,inner:6},answer:64,unit:"\u03C0 cm\xB2",prompt:g("Two circles share the same centre. Their radii are 10 cm and 6 cm. The ring between them is shaded.","Dua lingkaran memiliki pusat yang sama. Jari-jarinya 10 cm dan 6 cm. Daerah cincin di antaranya diarsir."),question:g("What is the shaded area in terms of \u03C0?","Berapa luas daerah arsiran dalam bentuk \u03C0?"),hints:q(["Subtract the inner circle's area from the outer circle's area.","Kurangi luas lingkaran dalam dari luas lingkaran luar."],["Square each radius separately before subtracting.","Kuadratkan masing-masing jari-jari sebelum mengurangkan."],["Use \u03C0 \xD7 (10\xB2 \u2212 6\xB2).","Gunakan \u03C0 \xD7 (10\xB2 \u2212 6\xB2)."]),solution:q(["Shaded area = \u03C0 \xD7 10\xB2 \u2212 \u03C0 \xD7 6\xB2 = (100 \u2212 36)\u03C0 = 64\u03C0 cm\xB2.","Luas arsiran = \u03C0 \xD7 10\xB2 \u2212 \u03C0 \xD7 6\xB2 = (100 \u2212 36)\u03C0 = 64\u03C0 cm\xB2."],["Squaring the difference, (10 \u2212 6)\xB2, would calculate something else.","Mengkuadratkan selisihnya, (10 \u2212 6)\xB2, menghasilkan besaran yang berbeda."]),insight:g("Subtract areas, not radii.","Kurangi luasnya, bukan jari-jarinya."),feedback:g("Exactly. You subtracted the two squared radii.","Tepat. Kamu mengurangkan kedua kuadrat jari-jari.")},{id:13,group:3,title:g("Twice as wide.","Dua kali lebih lebar."),mode:eo,diagram:"scale",type:"choice",answer:"4",prompt:g("Circle B has twice the radius of Circle A. Predict the area change, then use the size control to explore.","Jari-jari lingkaran B dua kali jari-jari lingkaran A. Prediksi perubahan luasnya, lalu coba pengatur ukurannya."),question:g("When the radius doubles, how many times as large is the area?","Ketika jari-jari menjadi dua kali lipat, luasnya menjadi berapa kali lipat?"),options:[{value:"2",label:g("2 times","2 kali")},{value:"3",label:g("3 times","3 kali")},{value:"4",label:g("4 times","4 kali")}],hints:q(["Area uses radius \xD7 radius.","Luas memakai jari-jari \xD7 jari-jari."],["If each radius becomes twice as large, what happens to their product?","Jika kedua faktor jari-jari menjadi dua kali lipat, bagaimana hasil kalinya?"],["\u03C0 \xD7 (2r)\xB2 = \u03C0 \xD7 4r\xB2.","\u03C0 \xD7 (2r)\xB2 = \u03C0 \xD7 4r\xB2."]),solution:q(["The area factor is 2 \xD7 2 = 4.","Faktor perubahan luasnya 2 \xD7 2 = 4."],["The circumference doubles, while the area becomes four times as large.","Keliling menjadi dua kali lipat, sedangkan luas menjadi empat kali lipat."]),insight:g("Length scales once; area scales twice.","Panjang mengikuti satu faktor skala; luas mengikuti kuadratnya."),feedback:g("Yes: doubling a radius multiplies the area by four.","Ya: menggandakan jari-jari membuat luasnya empat kali lipat.")},{id:14,group:3,title:g("Different pieces, equal area?","Potongan berbeda, luas sama?"),mode:to,diagram:"halves",type:"choice",answer:"same",prompt:g("On the left are two semicircles, each of radius 7 cm. On the right is one full circle of radius 7 cm.","Di kiri terdapat dua setengah lingkaran, masing-masing berjari-jari 7 cm. Di kanan terdapat satu lingkaran penuh berjari-jari 7 cm."),question:g("How do their total areas compare?","Bagaimana perbandingan jumlah luas di kiri dan luas di kanan?"),options:[{value:"left",label:g("The left total is larger","Jumlah luas di kiri lebih besar")},{value:"same",label:g("They are equal","Keduanya sama")},{value:"right",label:g("The right area is larger","Luas di kanan lebih besar")}],hints:q(["Both semicircles use the same radius as the full circle.","Kedua setengah lingkaran memakai jari-jari yang sama dengan lingkaran penuh."],["Two equal halves form one whole.","Dua bagian setengah yang sama membentuk satu keseluruhan."],["\xBD\u03C0 \xD7 7\xB2 + \xBD\u03C0 \xD7 7\xB2 = \u03C0 \xD7 7\xB2.","\xBD\u03C0 \xD7 7\xB2 + \xBD\u03C0 \xD7 7\xB2 = \u03C0 \xD7 7\xB2."]),solution:q(["Each semicircle has area \xBD\u03C0 \xD7 7\xB2. Together they have area 49\u03C0 cm\xB2.","Luas setiap setengah lingkaran \xBD\u03C0 \xD7 7\xB2. Jumlahnya 49\u03C0 cm\xB2."],["The full circle also has area \u03C0 \xD7 7\xB2 = 49\u03C0 cm\xB2.","Luas lingkaran penuh juga \u03C0 \xD7 7\xB2 = 49\u03C0 cm\xB2."]),insight:g("Compare matching pieces before calculating.","Bandingkan bagian yang bersesuaian sebelum menghitung."),feedback:g("Exactly. The pieces can be joined without changing their total area.","Tepat. Potongannya bisa digabungkan tanpa mengubah jumlah luasnya.")},{id:15,group:3,title:g("Does the area stay too?","Apakah luasnya juga tetap?"),mode:lo,diagram:"arbelos",params:{d:20,a:8,compare:!0},type:"choice",answer:"smaller",prompt:g("The small diameters change from 10 + 10 cm to 8 + 12 cm. We know that the green perimeter stays the same.","Diameter kecil berubah dari 10 + 10 cm menjadi 8 + 12 cm. Kita tahu keliling daerah hijau tetap sama."),question:g("What happens to the green area?","Bagaimana perubahan luas daerah hijau?"),options:[{value:"same",label:g("It stays the same","Tetap sama")},{value:"larger",label:g("It becomes larger","Menjadi lebih besar")},{value:"smaller",label:g("It becomes smaller","Menjadi lebih kecil")}],hints:q(["A rule about length may not also hold for area.","Hubungan untuk panjang belum tentu berlaku untuk luas."],["Compare the sum of the small squared radii: 5\xB2 + 5\xB2 and 4\xB2 + 6\xB2.","Bandingkan jumlah kuadrat jari-jari kecil: 5\xB2 + 5\xB2 dan 4\xB2 + 6\xB2."],["The removed area increases from 25\u03C0 to 26\u03C0 cm\xB2.","Luas yang dikurangi bertambah dari 25\u03C0 menjadi 26\u03C0 cm\xB2."]),solution:q(["For 10 + 10: green area = 50\u03C0 \u2212 12.5\u03C0 \u2212 12.5\u03C0 = 25\u03C0 cm\xB2.","Untuk 10 + 10: luas hijau = 50\u03C0 \u2212 12,5\u03C0 \u2212 12,5\u03C0 = 25\u03C0 cm\xB2."],["For 8 + 12: green area = 50\u03C0 \u2212 8\u03C0 \u2212 18\u03C0 = 24\u03C0 cm\xB2.","Untuk 8 + 12: luas hijau = 50\u03C0 \u2212 8\u03C0 \u2212 18\u03C0 = 24\u03C0 cm\xB2."],["The green area decreases by \u03C0 cm\xB2, even though its perimeter stays the same.","Luas hijau berkurang \u03C0 cm\xB2, meskipun kelilingnya tetap sama."]),insight:g("Equal perimeters do not guarantee equal areas.","Keliling yang sama belum tentu memberi luas yang sama."),feedback:g("Right. You checked area separately instead of copying the perimeter conclusion.","Benar. Kamu memeriksa luas secara terpisah dari kesimpulan tentang keliling.")},{id:16,group:3,title:g("Move the pieces.","Pindahkan potongannya."),mode:Jt,diagram:"shuffle",answer:32,unit:"\u03C0 cm\xB2",prompt:g("Two quarter-circle pieces each have radius 8 cm. Move one piece to join them into a semicircle, with no overlap.","Dua potongan seperempat lingkaran masing-masing berjari-jari 8 cm. Pindahkan satu potongan agar membentuk setengah lingkaran tanpa tumpang tindih."),question:g("What is their combined area in terms of \u03C0?","Berapa jumlah luas keduanya dalam bentuk \u03C0?"),hints:q(["Moving or turning a piece preserves its area.","Memindahkan atau memutar potongan mempertahankan luasnya."],["Two quarter circles make half a circle of the same radius.","Dua seperempat lingkaran membentuk setengah lingkaran dengan jari-jari yang sama."],["Use \xBD \xD7 \u03C0 \xD7 8\xB2.","Gunakan \xBD \xD7 \u03C0 \xD7 8\xB2."]),solution:q(["Combined area = 2 \xD7 \xBC \xD7 \u03C0 \xD7 8\xB2 = 32\u03C0 cm\xB2.","Jumlah luas = 2 \xD7 \xBC \xD7 \u03C0 \xD7 8\xB2 = 32\u03C0 cm\xB2."],["Joining the pieces changes the outline, but preserves their total area.","Menggabungkan potongan mengubah bentuk batasnya, tetapi mempertahankan jumlah luasnya."]),insight:g("Rearrange a region into a familiar shape.","Susun ulang daerah menjadi bangun yang dikenal."),feedback:g("Yes. Rearranging lets you use a simple half-circle area.","Ya. Dengan menyusun ulang, kamu bisa memakai luas setengah lingkaran.")},{id:17,group:4,title:g("From the edge to the centre.","Dari keliling ke pusat."),mode:eo,diagram:"circle",answer:7,unit:"cm",pi:"22/7",prompt:g("A circular badge has a circumference of 44 cm.","Sebuah lencana berbentuk lingkaran memiliki keliling 44 cm."),question:g("What is its radius?","Berapa jari-jarinya?"),hints:q(["Which length formula connects circumference and radius?","Rumus panjang mana yang menghubungkan keliling dan jari-jari?"],["44 = 2 \xD7 \u03C0 \xD7 r.","44 = 2 \xD7 \u03C0 \xD7 r."],["First find the diameter: 44 \xF7 (22/7). Then halve it.","Cari diameter dahulu: 44 \xF7 (22/7). Lalu bagi dua."]),solution:q(["Diameter = 44 \xF7 (22/7) = 14 cm.","Diameter = 44 \xF7 (22/7) = 14 cm."],["Radius = 14 \xF7 2 = 7 cm.","Jari-jari = 14 \xF7 2 = 7 cm."]),insight:g("Reverse a familiar formula one step at a time.","Balik urutan rumus yang dikenal, satu langkah setiap kali."),feedback:g("Correct. You worked backwards from circumference to radius.","Benar. Kamu berpikir mundur dari keliling ke jari-jari.")},{id:18,group:4,title:g("Read the whole clue.","Gunakan seluruh informasi."),mode:to,diagram:"semicircle",params:{unknown:!0},answer:7,unit:"cm",pi:"22/7",prompt:g("A semicircular window has a total perimeter of 36 cm, including its straight edge.","Jendela berbentuk setengah lingkaran memiliki keliling total 36 cm, termasuk sisi lurusnya."),question:g("What is the radius of the window?","Berapa jari-jari jendela itu?"),hints:q(["The total includes both a curved and a straight part.","Keliling total mencakup bagian melengkung dan bagian lurus."],["The arc is \u03C0r and the straight edge is 2r.","Panjang busur \u03C0r dan sisi lurus 2r."],["36 = (22/7 + 2)r = (36/7)r.","36 = (22/7 + 2)r = (36/7)r."]),solution:q(["36 = \u03C0r + 2r = (22/7 + 14/7)r = (36/7)r.","36 = \u03C0r + 2r = (22/7 + 14/7)r = (36/7)r."],["r = 36 \xF7 (36/7) = 7 cm. Check: 22 + 14 = 36 cm.","r = 36 \xF7 (36/7) = 7 cm. Periksa: 22 + 14 = 36 cm."]),insight:g("Build the correct relation before reversing it.","Susun hubungan yang tepat sebelum membalik perhitungannya."),feedback:g("Exactly. You included the straight edge in your backwards calculation.","Tepat. Kamu memasukkan sisi lurus saat menghitung mundur.")},{id:19,group:4,title:g("Find the missing circle.","Temukan lingkaran dalam."),mode:lo,diagram:"ring",params:{outer:10,inner:6,unknown:!0},answer:6,unit:"cm",prompt:g("A ring has outer radius 10 cm and shaded area 64\u03C0 cm\xB2. Both circles share a centre.","Daerah cincin memiliki jari-jari luar 10 cm dan luas arsiran 64\u03C0 cm\xB2. Kedua lingkaran memiliki pusat yang sama."),question:g("What is the inner radius?","Berapa jari-jari lingkaran dalam?"),hints:q(["Find the area of the missing inner circle.","Cari luas lingkaran dalam yang belum diketahui."],["Outer area = 100\u03C0 cm\xB2. Inner area = outer area \u2212 ring area.","Luas luar = 100\u03C0 cm\xB2. Luas dalam = luas luar \u2212 luas cincin."],["Inner area = 36\u03C0 cm\xB2, so the radius squared is 36.","Luas dalam = 36\u03C0 cm\xB2, sehingga kuadrat jari-jarinya 36."]),solution:q(["Inner area = 100\u03C0 \u2212 64\u03C0 = 36\u03C0 cm\xB2.","Luas dalam = 100\u03C0 \u2212 64\u03C0 = 36\u03C0 cm\xB2."],["\u03C0r\xB2 = 36\u03C0 gives r\xB2 = 36. Since 6 \xD7 6 = 36, r = 6 cm.","\u03C0r\xB2 = 36\u03C0 memberi r\xB2 = 36. Karena 6 \xD7 6 = 36, r = 6 cm."]),insight:g("Undo area subtraction, then undo squaring.","Balik pengurangan luas, lalu cari bilangan yang kuadratnya sesuai."),feedback:g("Right. You recovered the missing area before finding its radius.","Benar. Kamu menemukan luas yang hilang sebelum mencari jari-jarinya.")},{id:20,group:4,title:g("Half the edge. How much area?","Setengah keliling. Berapa luasnya?"),mode:Jt,diagram:"scale",params:{fixed:!0},answer:49,unit:"cm\xB2",prompt:g("Circle A has half the circumference of Circle B. Circle B has area 196 cm\xB2.","Keliling lingkaran A adalah setengah keliling lingkaran B. Luas lingkaran B adalah 196 cm\xB2."),question:g("What is the area of Circle A?","Berapa luas lingkaran A?"),hints:q(["Circumference and radius change by the same factor.","Keliling dan jari-jari berubah dengan faktor yang sama."],["Circle A has half the radius of B. What is the area factor?","Jari-jari A setengah jari-jari B. Berapa faktor perubahan luasnya?"],["The area factor is \xBD \xD7 \xBD = \xBC.","Faktor perubahan luasnya \xBD \xD7 \xBD = \xBC."]),solution:q(["Half the circumference means half the radius.","Setengah keliling berarti setengah jari-jari."],["Area A = \xBC \xD7 196 = 49 cm\xB2.","Luas A = \xBC \xD7 196 = 49 cm\xB2."]),insight:g("Translate a length ratio into an area ratio.","Ubah perbandingan panjang menjadi perbandingan luas."),feedback:g("Yes. The area is a quarter, so 196 \xF7 4 = 49 cm\xB2.","Ya. Luasnya seperempat, sehingga 196 \xF7 4 = 49 cm\xB2.")},{id:21,group:5,title:g("Four circles in a frame.","Empat lingkaran dalam bingkai."),mode:Jt,diagram:"four",answer:168,unit:"cm\xB2",pi:"22/7",prompt:g("Four equal circles fit exactly in a square of side 28 cm, in two rows of two. Neighbouring circles touch.","Empat lingkaran sama besar tepat berada dalam persegi bersisi 28 cm, tersusun dua baris dan dua kolom. Lingkaran yang bersebelahan saling bersinggungan."),question:g("Find the area inside the square but outside all four circles.","Tentukan luas daerah di dalam persegi tetapi di luar keempat lingkaran."),hints:q(["Plan two steps: find one radius, then subtract all four circle areas.","Rencanakan dua langkah: cari satu jari-jari, lalu kurangi luas keempat lingkaran."],["Four radii fit along one side of the square.","Empat jari-jari mengisi satu sisi persegi."],["Each radius is 7 cm. Square area = 784 cm\xB2.","Setiap jari-jari 7 cm. Luas persegi = 784 cm\xB2."]),solution:q(["Radius = 28 \xF7 4 = 7 cm. Each circle has area 154 cm\xB2.","Jari-jari = 28 \xF7 4 = 7 cm. Luas setiap lingkaran 154 cm\xB2."],["Shaded area = 28\xB2 \u2212 4 \xD7 154 = 784 \u2212 616 = 168 cm\xB2.","Luas arsiran = 28\xB2 \u2212 4 \xD7 154 = 784 \u2212 616 = 168 cm\xB2."]),insight:g("Use the arrangement to unlock a subtraction problem.","Gunakan susunan bangun untuk memulai pengurangan luas."),feedback:g("You linked the arrangement, the radius, and the area calculation.","Kamu menghubungkan susunan bangun, jari-jari, dan perhitungan luas.")},{id:22,group:5,title:g("Count the overlap once.","Hitung irisan satu kali."),mode:g("Stretch challenge","Tantangan lanjutan"),diagram:"lens",answer:112,unit:"cm\xB2",pi:"22/7",prompt:g("Two quarter circles of radius 14 cm have centres at opposite corners of a 14 cm square. Together they cover the entire square. Their overlap is green.","Dua seperempat lingkaran berjari-jari 14 cm berpusat di dua sudut berseberangan pada persegi bersisi 14 cm. Gabungannya menutupi seluruh persegi. Irisannya diarsir hijau."),question:g("Find the area of the green overlap.","Tentukan luas irisan hijau."),hints:q(["When you add both quarter-circle areas, which region is counted twice?","Jika kedua luas seperempat lingkaran dijumlahkan, daerah mana yang dihitung dua kali?"],["Their sum equals one square plus one extra copy of the overlap.","Jumlahnya sama dengan satu persegi ditambah satu salinan ekstra daerah irisan."],["Overlap = two quarter-circle areas \u2212 square area.","Luas irisan = dua luas seperempat lingkaran \u2212 luas persegi."]),solution:q(["Two quarter-circle areas = 2 \xD7 \xBC \xD7 (22/7) \xD7 14\xB2 = 308 cm\xB2.","Dua luas seperempat lingkaran = 2 \xD7 \xBC \xD7 (22/7) \xD7 14\xB2 = 308 cm\xB2."],["This sum counts the entire square once, and the overlap a second time.","Jumlah ini menghitung seluruh persegi satu kali dan daerah irisan satu kali lagi."],["Overlap = 308 \u2212 14\xB2 = 308 \u2212 196 = 112 cm\xB2.","Luas irisan = 308 \u2212 14\xB2 = 308 \u2212 196 = 112 cm\xB2."]),insight:g("Adding overlapping regions can count one part twice.","Penjumlahan daerah yang beririsan dapat menghitung satu bagian dua kali."),feedback:g("Exactly. You removed the single square to leave one copy of the overlap.","Tepat. Kamu mengurangi satu luas persegi sehingga tersisa satu luas irisan.")},{id:23,group:5,title:g("Let the wheel roll.","Biarkan roda berputar."),mode:Jt,diagram:"wheel",answer:10,unit:"",pi:"22/7",prompt:g("A wheel of radius 7 cm rolls 440 cm along a straight track without slipping. Explore one complete turn below.","Roda berjari-jari 7 cm menggelinding sejauh 440 cm pada lintasan lurus tanpa selip. Coba peragakan satu putaran penuh di bawah."),question:g("How many complete revolutions does it make?","Berapa putaran penuh yang dilakukan roda?"),hints:q(["One revolution moves the wheel forward by one circumference.","Satu putaran memindahkan roda sejauh satu kelilingnya."],["Distance per revolution = 2 \xD7 (22/7) \xD7 7.","Jarak setiap putaran = 2 \xD7 (22/7) \xD7 7."],["Each revolution covers 44 cm. Divide the total distance by 44.","Setiap putaran menempuh 44 cm. Bagi jarak total dengan 44."]),solution:q(["One revolution covers 2\u03C0r = 2 \xD7 (22/7) \xD7 7 = 44 cm.","Satu putaran menempuh 2\u03C0r = 2 \xD7 (22/7) \xD7 7 = 44 cm."],["Revolutions = 440 \xF7 44 = 10.","Banyak putaran = 440 \xF7 44 = 10."]),insight:g("Connect a rotation to a straight-line distance.","Hubungkan putaran dengan jarak lurus."),feedback:g("Correct. Ten circumferences give a distance of 440 cm.","Benar. Sepuluh kali keliling menghasilkan jarak 440 cm.")},{id:24,group:5,title:g("Bring the clues together.","Hubungkan semua petunjuk."),mode:g("Final mission","Misi terakhir"),diagram:"arbelos",params:{d:28,a:14,hidden:!0},answer:154,unit:"cm\xB2",pi:"22/7",prompt:g("Two equal small semicircles fill the diameter of a large semicircle. The entire curved boundary of the green region is 88 cm long.","Dua setengah lingkaran kecil yang sama besar mengisi diameter setengah lingkaran besar. Seluruh batas melengkung daerah hijau panjangnya 88 cm."),question:g("What is the area of the green region?","Berapa luas daerah hijau?"),hints:q(["First use the boundary to find the large diameter. Then find the three radii.","Gunakan batas daerah untuk mencari diameter besar. Lalu tentukan ketiga jari-jarinya."],["If the large diameter is D, all three arcs total \u03C0D.","Jika diameter besar D, jumlah panjang ketiga busur adalah \u03C0D."],["D = 88 \xF7 (22/7) = 28 cm. The radii are 14 cm, 7 cm, and 7 cm.","D = 88 \xF7 (22/7) = 28 cm. Jari-jarinya 14 cm, 7 cm, dan 7 cm
